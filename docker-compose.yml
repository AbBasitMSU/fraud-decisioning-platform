# =============================================================================
# FRAUD DECISIONING PLATFORM - Docker Compose
# =============================================================================
# Complete stack: API + Dashboard + Monitoring

version: '3.8'

services:
  # -------------------------------------------------------------------------
  # FRAUD SCORING API
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: fraud-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - ./models:/app/models:ro
      - ./data/sample:/app/data/sample:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # -------------------------------------------------------------------------
  # STREAMLIT DASHBOARD
  # -------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    container_name: fraud-dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data/sample:/app/data/sample:ro
    restart: unless-stopped
    depends_on:
      - api

  # -------------------------------------------------------------------------
  # NGINX REVERSE PROXY (Optional)
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: fraud-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - dashboard
    profiles:
      - production

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  default:
    name: fraud-network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  model-data:
