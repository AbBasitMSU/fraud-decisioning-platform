# =============================================================================
# FRAUD DECISIONING PLATFORM - CI/CD Pipeline
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ===========================================================================
  # LINT & TYPE CHECK
  # ===========================================================================
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install linters
        run: |
          pip install black isort flake8 mypy
      
      - name: Check formatting with Black
        run: black --check src/ tests/ --diff || true
      
      - name: Check imports with isort
        run: isort --check-only src/ tests/ --diff || true
      
      - name: Lint with flake8
        run: flake8 src/ tests/ --max-line-length=120 --ignore=E501,W503 || true

  # ===========================================================================
  # TEST
  # ===========================================================================
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
      
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ===========================================================================
  # BUILD & PUSH DOCKER (on main only)
  # ===========================================================================
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false
          tags: fraud-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: dashboard
          push: false
          tags: fraud-dashboard:latest

  # ===========================================================================
  # SECURITY SCAN
  # ===========================================================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install safety
        run: pip install safety bandit
      
      - name: Check for vulnerabilities
        run: safety check -r requirements.txt || true
      
      - name: Run bandit security scan
        run: bandit -r src/ -ll || true

  # ===========================================================================
  # DEPLOY TO STREAMLIT (on main only)
  # ===========================================================================
  deploy-streamlit:
    name: 🚀 Deploy Streamlit
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Trigger Streamlit Deploy
        run: |
          echo "Streamlit Cloud auto-deploys from main branch"
          echo "Dashboard URL: https://fraud-decisioning-platform.streamlit.app"
